[project]
name = "casework"
version = "0.1.0"
description = "Scoped subject collection and face-clustering workbench for authorised investigators"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "opencv-python-headless>=4.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
recog = [
    "onnxruntime>=1.17",
]
app = [
    "pywebview>=5.0; sys_platform == 'darwin'",
    "pyinstaller>=6.10",
]
vision = [
    "pyobjc-framework-Vision>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.1; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
casework = "casework.cli:main"
casework-desktop = "casework.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casework"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/casework/web/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
